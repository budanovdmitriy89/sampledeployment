name: CI Pipeline

on:
  push:
    branches:
      - main  # Пайплайн сработает при пуше в main
  pull_request:
    branches:
      - main  # Пайплайн сработает при создании PR в main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Find java.home in gradle
        run: grep 'org.gradle.java.home' gradle.properties || echo "Not found"

      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run tests
        run: ./gradlew test

      - name: Build Docker image
        run: docker build -t your-image-name .
